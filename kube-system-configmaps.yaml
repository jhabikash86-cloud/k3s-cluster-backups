- apiVersion: v1
  data:
    Corefile: |
      .:53 {
          errors
          health
          ready
          kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
          }
          hosts /etc/coredns/NodeHosts {
            ttl 60
            reload 15s
            fallthrough
          }
          prometheus :9153
          cache 30
          loop
          reload
          loadbalance
          import /etc/coredns/custom/*.override
          forward . /etc/resolv.conf
      }
      import /etc/coredns/custom/*.server
    NodeHosts: |
      100.84.255.44 k3s-worker-aws-ec2
      192.168.18.113 k3s-master
      192.168.18.114 k8s-worker-onprem
