- apiVersion: v1
  data:
    kpi_consumer.py: |
      import json
      import os
      import time

      import pika
      import psycopg2

      RABBITMQ_HOST = os.getenv("RABBITMQ_HOST", "100.79.30.100")
      RABBITMQ_PORT = int(os.getenv("RABBITMQ_PORT", "30372"))
      RABBITMQ_USER = os.getenv("RABBITMQ_USER", "guest")
      RABBITMQ_PASSWORD = os.getenv("RABBITMQ_PASSWORD", "guest")

      POSTGRES_HOST = os.getenv("POSTGRES_HOST", "100.79.30.100")
      POSTGRES_PORT = int(os.getenv("POSTGRES_PORT", "30432"))
      POSTGRES_DB = os.getenv("POSTGRES_DB", "postgres")
      POSTGRES_USER = os.getenv("POSTGRES_USER", "postgres")
      POSTGRES_PASSWORD = os.getenv("POSTGRES_PASSWORD")

      QUEUES = ["t1_taxistand", "t1_departure"]
      WINDOW_SECONDS = 60

      # Same alert thresholds the original analytics consumer used — meaningful
      # given fake_fusion.py's actual data range (merged_object_count is 0-5).
      ALERT_THRESHOLD = 3

      UPSERT_SQL = """
      INSERT INTO kpi_zone_rollup
          (zone, window_start, event_count, total_object_count, avg_object_count, max_object_count, alert_count, updated_at)
      VALUES
          (%(zone)s, %(window_start)s, 1, %(count)s, %(count)s, %(count)s, %(alert)s, now())
      ON CONFLICT (zone, window_start) DO UPDATE SET
          event_count = kpi_zone_rollup.event_count + 1,
          total_object_count = kpi_zone_rollup.total_object_count + EXCLUDED.total_object_count,
          avg_object_count = (kpi_zone_rollup.total_object_count + EXCLUDED.total_object_count)::float
                              / (kpi_zone_rollup.event_count + 1),
          max_object_count = GREATEST(kpi_zone_rollup.max_object_count, EXCLUDED.max_object_count),
          alert_count = kpi_zone_rollup.alert_count + EXCLUDED.alert_count,
          updated_at = now();
      """


      def connect_db():
          return psycopg2.connect(
              host=POSTGRES_HOST, port=POSTGRES_PORT, dbname=POSTGRES_DB,
              user=POSTGRES_USER, password=POSTGRES_PASSWORD,
          )


      def connect_rabbitmq():
          return pika.BlockingConnection(pika.ConnectionParameters(
              host=RABBITMQ_HOST, port=RABBITMQ_PORT,
              credentials=pika.PlainCredentials(RABBITMQ_USER, RABBITMQ_PASSWORD),
          ))


      def main():
          db = connect_db()
          db.autocommit = True
          print(f"Connected to Postgres at {POSTGRES_HOST}:{POSTGRES_PORT}/{POSTGRES_DB}")

          connection = connect_rabbitmq()
          channel = connection.channel()
          for q in QUEUES:
              channel.queue_declare(queue=q, durable=True)
          print(f"Connected to RabbitMQ at {RABBITMQ_HOST}:{RABBITMQ_PORT}. Consuming: {QUEUES}")

          def handle_message(ch, method, properties, body):
              try:
                  data = json.loads(body)
                  zone = data["zone"]
                  count = int(data["merged_object_count"])
                  event_ts = float(data.get("timestamp", time.time()))
                  window_start = time.strftime(
                      "%Y-%m-%d %H:%M:00+00", time.gmtime((event_ts // WINDOW_SECONDS) * WINDOW_SECONDS)
                  )
                  alert = 1 if count > ALERT_THRESHOLD else 0

                  with db.cursor() as cur:
                      cur.execute(UPSERT_SQL, {
                          "zone": zone, "window_start": window_start,
                          "count": count, "alert": alert,
                      })
              except Exception as err:
                  print(f"Failed to process message: {err} | body={body}")
              finally:
                  ch.basic_ack(delivery_tag=method.delivery_tag)

          for q in QUEUES:
              channel.basic_consume(queue=q, on_message_callback=handle_message)

          print("KPI Consumer running. Waiting for messages...")
          channel.start_consuming()


      if __name__ == "__main__":
          main()
