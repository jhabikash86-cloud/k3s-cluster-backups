  data:
    kpi_api.py: |
      import base64
      import json
      import os
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.error import HTTPError, URLError
      from urllib.parse import quote, urlparse, parse_qs
      from urllib.request import Request, urlopen

      import psycopg2
      import psycopg2.extras


      BROKER_HOST = os.getenv("RABBITMQ_HOST", "100.79.30.100")
      BROKER_PORT = int(os.getenv("RABBITMQ_MANAGEMENT_PORT", "30672"))
      BROKER_USER = os.getenv("RABBITMQ_USER", "guest")
      BROKER_PASSWORD = os.getenv("RABBITMQ_PASSWORD", "guest")
      API_PORT = int(os.getenv("PORT", "8080"))
      # Only the two real, canonical zone queues remain — the kpi_* duplicates from
      # the earlier accidental double-consumer setup were removed.
      KPI_QUEUES = ("t1_taxistand", "t1_departure")

      POSTGRES_HOST = os.getenv("POSTGRES_HOST", "100.79.30.100")
      POSTGRES_PORT = int(os.getenv("POSTGRES_PORT", "30432"))
      POSTGRES_DB = os.getenv("POSTGRES_DB", "postgres")
      POSTGRES_USER = os.getenv("POSTGRES_USER", "postgres")
      POSTGRES_PASSWORD = os.getenv("POSTGRES_PASSWORD")


      def broker_json(path: str) -> dict:
          token = base64.b64encode(f"{BROKER_USER}:{BROKER_PASSWORD}".encode()).decode()
          request = Request(
              f"http://{BROKER_HOST}:{BROKER_PORT}{path}",
              headers={"Authorization": f"Basic {token}"},
          )
          with urlopen(request, timeout=5) as response:
              return json.load(response)


      def queue_kpi(name: str) -> dict:
          queue = broker_json(f"/api/queues/%2F/{quote(name, safe='')}")
          return {
              "queue": name,
              "messages": queue.get("messages", 0),
              "messages_ready": queue.get("messages_ready", 0),
              "messages_unacknowledged": queue.get("messages_unacknowledged", 0),
              "consumers": queue.get("consumers", 0),
          }


      def db_connect():
          return psycopg2.connect(
              host=POSTGRES_HOST, port=POSTGRES_PORT, dbname=POSTGRES_DB,
              user=POSTGRES_USER, password=POSTGRES_PASSWORD,
          )


      def latest_rollups() -> list:
          """Most recent window per zone."""
          with db_connect() as conn, conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
              cur.execute("""
                  SELECT DISTINCT ON (zone) zone, window_start, event_count,
                         avg_object_count, max_object_count, alert_count, updated_at
                  FROM kpi_zone_rollup
                  ORDER BY zone, window_start DESC
              """)
              return [dict(row) for row in cur.fetchall()]


      def zone_history(zone: str, limit: int) -> list:
          with db_connect() as conn, conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
              cur.execute("""
                  SELECT zone, window_start, event_count, avg_object_count,
                         max_object_count, alert_count, updated_at
                  FROM kpi_zone_rollup
                  WHERE zone = %s
                  ORDER BY window_start DESC
                  LIMIT %s
              """, (zone, limit))
              return [dict(row) for row in cur.fetchall()]


      class Handler(BaseHTTPRequestHandler):
          def send_json(self, status: int, payload) -> None:
              body = json.dumps(payload, default=str).encode()
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self) -> None:
              parsed = urlparse(self.path)
              path = parsed.path

              if path == "/healthz":
                  result = {"status": "ok"}
                  try:
                      broker_json("/api/overview")
                      result["rabbitmq_reachable"] = True
                  except (HTTPError, URLError, TimeoutError, ValueError) as error:
                      result["rabbitmq_reachable"] = False
                      result["rabbitmq_error"] = str(error)
                  try:
                      with db_connect():
                          pass
                      result["postgres_reachable"] = True
                  except Exception as error:
                      result["postgres_reachable"] = False
                      result["postgres_error"] = str(error)
                  if not result["rabbitmq_reachable"] or not result["postgres_reachable"]:
                      result["status"] = "degraded"
                  self.send_json(200, result)
                  return

              # --- RabbitMQ queue-depth endpoints (operational health, not KPI data) ---
              if path == "/kpis":
                  try:
                      queues = [queue_kpi(name) for name in KPI_QUEUES]
                      self.send_json(200, {"queues": queues})
                  except (HTTPError, URLError, TimeoutError, ValueError) as error:
                      self.send_json(503, {"detail": f"RabbitMQ query failed: {error}"})
                  return

              if path.startswith("/kpis/"):
                  name = path.removeprefix("/kpis/")
                  if name not in KPI_QUEUES:
                      self.send_json(404, {"detail": "Unknown KPI queue"})
                      return
                  try:
                      self.send_json(200, queue_kpi(name))
                  except (HTTPError, URLError, TimeoutError, ValueError) as error:
                      self.send_json(503, {"detail": f"RabbitMQ query failed: {error}"})
                  return

              # --- Postgres-backed KPI data (the actual dashboard data source) ---
              if path == "/kpi/zones":
                  try:
                      self.send_json(200, {"zones": latest_rollups()})
                  except Exception as error:
                      self.send_json(503, {"detail": f"Postgres query failed: {error}"})
                  return

              if path.startswith("/kpi/zones/") and path.endswith("/history"):
                  zone = path.removeprefix("/kpi/zones/").removesuffix("/history")
                  limit = int(parse_qs(parsed.query).get("limit", ["20"])[0])
                  try:
                      self.send_json(200, {"zone": zone, "history": zone_history(zone, limit)})
                  except Exception as error:
                      self.send_json(503, {"detail": f"Postgres query failed: {error}"})
                  return

              self.send_json(404, {
                  "detail": "Use /healthz, /kpis, /kpis/{queue}, /kpi/zones, or /kpi/zones/{zone}/history"
              })

          def log_message(self, format: str, *args) -> None:
              print(format % args)


      if __name__ == "__main__":
          print(f"KPI API listening on port {API_PORT}")
          ThreadingHTTPServer(("0.0.0.0", API_PORT), Handler).serve_forever()
