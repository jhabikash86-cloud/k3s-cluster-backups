apiVersion: v1
kind: ConfigMap
metadata:
  name: kpi-dashboard
  namespace: outsight-database
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      location /kpi/ {
        proxy_pass http://kpi-api.outsight-database.svc.cluster.local:8080/kpi/;
      }
      location /healthz {
        proxy_pass http://kpi-api.outsight-database.svc.cluster.local:8080/healthz;
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8"/>
      <title>PALS lab KPIs</title>
      <style>
        body { font-family: sans-serif; background:#111; color:#eee; margin:24px; }
        h1 { font-size:20px; }
        .row { display:flex; gap:16px; flex-wrap:wrap; }
        .card { background:#1c1c1c; padding:16px 20px; min-width:220px; border-radius:8px; }
        .zone { font-size:14px; color:#9ad; }
        .n { font-size:36px; margin:8px 0; }
        .meta { color:#888; font-size:12px; }
        .err { color:#f66; }
      </style>
    </head>
    <body>
      <h1>PALS lab — touchpoint KPIs</h1>
      <p class="meta" id="ts">loading…</p>
      <div class="row" id="cards"></div>
      <script>
        async function tick() {
          try {
            const r = await fetch("/kpi/zones");
            const j = await r.json();
            document.getElementById("ts").textContent = "updated " + new Date().toISOString();
            document.getElementById("cards").innerHTML = (j.zones || []).map(z =>
              `<div class="card">
                 <div class="zone">${z.zone}</div>
                 <div class="n">${z.event_count}</div>
                 <div class="meta">window ${z.window_start}<br/>max ${z.max_object_count} · alerts ${z.alert_count}</div>
               </div>`
            ).join("") || "<p>no zones yet</p>";
          } catch (e) {
            document.getElementById("ts").innerHTML = '<span class="err">'+e+'</span>';
          }
        }
        tick();
        setInterval(tick, 5000);
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpi-dashboard
  namespace: outsight-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kpi-dashboard
  template:
    metadata:
      labels:
        app: kpi-dashboard
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-aws
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: html
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html
          configMap:
            name: kpi-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: kpi-dashboard
  namespace: outsight-database
spec:
  selector:
    app: kpi-dashboard
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kpi-dashboard
  namespace: outsight-database
spec:
  rules:
    - host: dash.pals.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kpi-dashboard
                port:
                  number: 80
